name: CI

on:
  push:
    branches: [main, "claude/*", "feature/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pandas

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/omega_pbpk/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -q

      - name: Check test count
        run: |
          python -m pytest tests/ --collect-only -q 2>&1 | tail -1

      - name: Check version consistency
        run: |
          PYPROJECT_VER=$(grep -m1 '^version = ' pyproject.toml | grep -oP '(?<=")[^"]+')
          SERVER_VER=$(grep -oP '(?<=version=")[^"]+' src/omega_pbpk/api/server.py | head -1)
          echo "pyproject.toml version: $PYPROJECT_VER"
          echo "api/server.py version:  $SERVER_VER"
          if [ "$PYPROJECT_VER" != "$SERVER_VER" ]; then
            echo "ERROR: version mismatch between pyproject.toml ($PYPROJECT_VER) and api/server.py ($SERVER_VER)"
            exit 1
          fi
          echo "Version check passed: $PYPROJECT_VER"
