name: Warfarin
mw: 308.33
logP: 2.7
pka: [5.1]
drug_type: monoprotic_acid
compound_type: acid
partition_method: heuristic
fup: 0.01
rbp: 0.58
smiles: "OC(CC(=O)c1ccccc1)c1c(=O)oc2ccccc12"

clearance:
  clint_uL_min_pmol:
    CYP2C9: 0.18
    CYP3A4: 0.04
  fm:
    CYP2C9: 0.80
    CYP3A4: 0.15
    other: 0.05
  # Calibrated in vivo hepatic CLint (L/h)
  # Literature: CL/F ~ 1.5-2.0 L/h, t1/2 ~ 35-45 h, F ~ 1.0
  # Well-stirred: CL_h = Q*fup*CLint/(Q + fup*CLint)
  # Target CL_h = 1.58 L/h with fup=0.01: CLint = 161 L/h
  clint_hepatic_L_per_h: 161.0
  clr_L_per_h: 0.0

absorption:
  peff: 2.5
  solubility_mg_mL: 0.054
  particle_radius_um: 25.0
  particle_density: 1.2

distribution:
  # Target Vss ~ 30L (apparent Vd/F from clinical data)
  # Warfarin is highly protein-bound (fup=0.01) but distributes
  # moderately into liver and well-perfused tissues
  kp:
    lung: 0.40
    brain: 0.20
    heart: 0.35
    kidney: 0.50
    liver: 1.50
    spleen: 0.40
    gut_wall: 0.55
    pancreas: 0.35
    thymus: 0.25
    reproductive: 0.30
    rest: 0.40
  permeability_limited:
    adipose:
      kp: 0.35
      ps: 12
    muscle:
      kp: 1.00
      ps: 30
    bone:
      kp: 0.25
      ps: 5
    skin:
      kp: 0.35
      ps: 10

gut_metabolism:
  gut_clint_multiplier: 0.1
