[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physio-sim"
version = "0.1.0"
description = "Whole-body PBPK-like and minimal PD simulation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.9",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.8",
  "types-PyYAML",
]

[tool.setuptools]
packages = [
    "physio_sim",
    "physio_sim.pbpk",
    "physio_sim.pd",
    "physio_sim.qsp",
    "physio_sim.qsp.models",
    "physio_sim.utils",
    "physio_sim.validation",
    "physio_sim.core",
    "physio_sim.pipeline",
    "physio_sim.risk",
    "omega",
    "omega.core",
    "omega.pipeline",
    "omega.risk",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["physio_sim.cli"]
ignore_errors = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
