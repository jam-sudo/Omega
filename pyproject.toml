[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-pbpk"
version = "0.9.0"
description = "Whole-body PBPK simulation platform — 35-state ODE engine with ADME prediction, DDI, population PK, and clinical tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["pbpk", "pharmacokinetics", "drug-development", "simulation"]
dependencies = [
  "numpy~=1.26",
  "scipy~=1.11",
  "pydantic~=2.0",
  "pyyaml~=6.0",
  "typer~=0.9",
  "matplotlib~=3.7",
  "fastapi~=0.100",
  "uvicorn~=0.20",
  "httpx~=0.24",
]

[project.urls]
Repository = "https://github.com/jam-sudo/Omega"

[project.optional-dependencies]
dev = [
  "pytest~=8.0",
  "ruff~=0.6",
  "mypy~=1.8",
  "types-PyYAML",
  "httpx~=0.24",
]
ml = [
  "torch~=2.0",
  "rdkit>=2023.0",
]
api = [
  "fastapi~=0.100",
  "uvicorn~=0.20",
  "httpx~=0.24",
]

[project.scripts]
omega = "omega_pbpk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["omega_pbpk.cli", "omega_pbpk.api.server", "omega_pbpk.ml_models.gnn_adme"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["yaml", "torch", "torch.*", "rdkit", "rdkit.*", "fastapi", "uvicorn"]
ignore_missing_imports = true
